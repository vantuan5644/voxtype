name: CI

on:
  push:
    branches: [main, dev, windows]
  pull_request:

# Platform checks run independently so failures identify the affected build.
# Required status checks on dev (PR-time) and main (release-time) use the
# aggregate job below.

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libclang-dev cmake \
            libgtk-3-dev libglib2.0-dev libx11-dev libxi-dev libxtst-dev

      - name: cargo clippy -- -D warnings
        run: cargo clippy --all-targets --no-deps -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libclang-dev cmake \
            libgtk-3-dev libglib2.0-dev libx11-dev libxi-dev libxtst-dev

      - name: cargo test
        run: cargo test

  windows:
    name: windows
    runs-on: windows-latest
    # whisper.cpp's nested Vulkan shader build exceeds MSBuild's path limit
    # under the normal checkout target directory.
    env:
      CARGO_TARGET_DIR: C:\vt
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          choco install vulkan-sdk --yes --no-progress
          $sdk = Get-ChildItem C:\VulkanSDK -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $sdk) { throw "Vulkan SDK installation directory was not found" }
          "VULKAN_SDK=$($sdk.FullName)" | Out-File $env:GITHUB_ENV -Append
          "$($sdk.FullName)\Bin" | Out-File $env:GITHUB_PATH -Append

      - name: Test Windows targets
        run: cargo test --locked --all-targets

      - name: Clippy Windows targets
        run: cargo clippy --locked --all-targets --no-deps -- -D warnings

      - name: Build Windows Vulkan release
        run: cargo build --locked --release --features gpu-vulkan

  # Aggregator job — branch protection only needs to require `ci-success`.
  # Adding/removing parallel checks above just updates the `needs:` list;
  # the protection rule never needs to be touched.
  ci-success:
    name: ci-success
    needs: [fmt, clippy, test, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs succeeded
        run: |
          set -e
          fmt='${{ needs.fmt.result }}'
          clippy='${{ needs.clippy.result }}'
          test='${{ needs.test.result }}'
          windows='${{ needs.windows.result }}'
          echo "fmt:    $fmt"
          echo "clippy: $clippy"
          echo "test:   $test"
          echo "windows: $windows"
          if [[ "$fmt" != success || "$clippy" != success || "$test" != success || "$windows" != success ]]; then
            echo "::error::One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs succeeded."
